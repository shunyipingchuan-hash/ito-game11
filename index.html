<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>糸通し</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14171a">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="糸通し">

<style>
  :root {
    --bg: #14171a;
    --fg: #f5f5f2;
    --dim: rgba(245, 245, 242, 0.45);
    --accent: #e8b84b;
    --panel-bg: #1d2124;
    --panel-border: rgba(245, 245, 242, 0.25);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    font-family: "MS Gothic", "Courier New", monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: var(--bg);
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 13, 0.75);
    padding: 16px;
    z-index: 10;
  }
  .overlay[hidden] { display: none !important; }
  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    padding: 24px 20px;
    width: min(320px, 100%);
    text-align: center;
    color: var(--fg);
  }
  .panel-title {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    color: var(--accent);
    margin: 0 0 10px;
  }
  .panel-score {
    font-size: 14px;
    color: var(--dim);
    margin: 0 0 16px;
  }
  #nameInput {
    width: 100%;
    background: #0f1113;
    border: 1px solid var(--panel-border);
    color: var(--fg);
    font-family: inherit;
    font-size: 16px;
    padding: 10px;
    text-align: center;
    letter-spacing: 2px;
    border-radius: 2px;
  }
  #nameInput:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .panel-actions { display: flex; gap: 10px; margin-top: 16px; }
  .panel-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    padding: 10px 0;
    border-radius: 2px;
    border: 1px solid var(--panel-border);
    background: transparent;
    color: var(--fg);
  }
  #submitNameBtn { background: var(--accent); border-color: var(--accent); color: #14171a; font-weight: bold; }
  .panel-actions button:active { opacity: 0.8; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="nameEntry" class="overlay" hidden>
  <div class="panel">
    <p class="panel-title">TOP5 ランクイン！</p>
    <p class="panel-score">SCORE <span id="entryScore">0</span></p>
    <input id="nameInput" type="text" maxlength="10" placeholder="なまえ（10文字まで）" autocomplete="off" />
    <div class="panel-actions">
      <button id="submitNameBtn" type="button">登録する</button>
      <button id="skipNameBtn" type="button">スキップ</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ==========================================================================
   * 物理・難易度 調整用パラメータ
   * 難易度(Easy/Normal/Hard)ごとにプリセットをまとめてあります。
   * ========================================================================== */
  const DIFFICULTIES = {
    easy: {
      label: "EASY",
      GRAVITY: 900, LIFT: 1100, MAX_UP_SPEED: 190, MAX_DOWN_SPEED: 260,
      BASE_SCROLL_SPEED: 100, SPEED_INCREASE_PER_SCORE: 1.5, MAX_SCROLL_SPEED: 220,
      GAP_BASE: 230, GAP_MIN: 160, GAP_DECREASE_PER_SCORE: 1.0, OBSTACLE_SPACING: 320
    },
    normal: {
      label: "NORMAL",
      GRAVITY: 1300, LIFT: 1500, MAX_UP_SPEED: 230, MAX_DOWN_SPEED: 340,
      BASE_SCROLL_SPEED: 150, SPEED_INCREASE_PER_SCORE: 3.5, MAX_SCROLL_SPEED: 340,
      GAP_BASE: 190, GAP_MIN: 110, GAP_DECREASE_PER_SCORE: 2.2, OBSTACLE_SPACING: 300
    },
    hard: {
      label: "HARD",
      GRAVITY: 1500, LIFT: 1650, MAX_UP_SPEED: 250, MAX_DOWN_SPEED: 380,
      BASE_SCROLL_SPEED: 190, SPEED_INCREASE_PER_SCORE: 4.5, MAX_SCROLL_SPEED: 400,
      GAP_BASE: 165, GAP_MIN: 95, GAP_DECREASE_PER_SCORE: 2.6, OBSTACLE_SPACING: 285
    }
  };
  const DIFFICULTY_ORDER = ["easy", "normal", "hard"];

  let selectedDifficulty = "normal";
  let runDifficulty = "normal";
  let GRAVITY, LIFT, MAX_UP_SPEED, MAX_DOWN_SPEED, BASE_SCROLL_SPEED;
  let SPEED_INCREASE_PER_SCORE, MAX_SCROLL_SPEED;
  let GAP_BASE, GAP_MIN, GAP_DECREASE_PER_SCORE, OBSTACLE_SPACING;

  function applyDifficulty(key) {
    const d = DIFFICULTIES[key];
    selectedDifficulty = key;
    GRAVITY = d.GRAVITY;
    LIFT = d.LIFT;
    MAX_UP_SPEED = d.MAX_UP_SPEED;
    MAX_DOWN_SPEED = d.MAX_DOWN_SPEED;
    BASE_SCROLL_SPEED = d.BASE_SCROLL_SPEED;
    SPEED_INCREASE_PER_SCORE = d.SPEED_INCREASE_PER_SCORE;
    MAX_SCROLL_SPEED = d.MAX_SCROLL_SPEED;
    GAP_BASE = d.GAP_BASE;
    GAP_MIN = d.GAP_MIN;
    GAP_DECREASE_PER_SCORE = d.GAP_DECREASE_PER_SCORE;
    OBSTACLE_SPACING = d.OBSTACLE_SPACING;
  }

  function cycleDifficulty(dir) {
    const idx = DIFFICULTY_ORDER.indexOf(selectedDifficulty);
    const next = DIFFICULTY_ORDER[(idx + dir + DIFFICULTY_ORDER.length) % DIFFICULTY_ORDER.length];
    applyDifficulty(next);
  }

  applyDifficulty(selectedDifficulty);

  const OBSTACLE_WIDTH = 56;
  const PLAYER_RADIUS = 9;
  const TAIL_LENGTH = 16;
  const TAIL_SPACING = 7;
  const TAIL_SAMPLE_INTERVAL = 0.02;

  const COLOR_BG = "#14171a";
  const COLOR_FG = "#f5f5f2";
  const COLOR_OBSTACLE = "rgba(245, 245, 242, 0.82)";
  const COLOR_DIM = "rgba(245, 245, 242, 0.45)";
  const COLOR_ACCENT = "#e8b84b";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let width = 0;
  let height = 0;
  let dpr = 1;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    playerX = Math.max(70, Math.min(140, width * 0.26));
  }

  // ---- 共有ランキング (Claude Artifact の db capability を使用) ----
  // GitHub Pages 単体では window.claude が存在しないため、db は常に null になり
  // ランキングUIは自動的に非表示のまま静かに無効化される（エラーにはならない）。
  let db = null;
  let leaderboards = { easy: [], normal: [], hard: [] };

  async function initDb() {
    try {
      db = window.claude ? await window.claude.use("db") : null;
    } catch (e) {
      db = null;
    }
    if (!db) return;
    DIFFICULTY_ORDER.forEach(function (diff) {
      db.doc("scores/" + diff).onSnapshot(
        function (snap) {
          const data = snap.exists ? snap.data() : null;
          leaderboards[diff] = (data && Array.isArray(data.entries)) ? data.entries : [];
        },
        function () {
          /* このボードだけ更新が届かなくてもゲームは続行 */
        }
      );
    });
  }
  initDb();

  const nameEntryEl = document.getElementById("nameEntry");
  const nameInput = document.getElementById("nameInput");
  const entryScoreEl = document.getElementById("entryScore");
  const submitNameBtn = document.getElementById("submitNameBtn");
  const skipNameBtn = document.getElementById("skipNameBtn");
  let nameEntryOpen = false;
  let pendingScore = 0;

  function openNameEntry(finalScore) {
    nameEntryOpen = true;
    pendingScore = finalScore;
    entryScoreEl.textContent = String(finalScore);
    nameInput.value = "";
    nameEntryEl.hidden = false;
    setTimeout(function () {
      nameInput.focus();
    }, 0);
  }

  function closeNameEntry() {
    nameEntryEl.hidden = true;
    nameEntryOpen = false;
  }

  function submitName() {
    if (!db) {
      closeNameEntry();
      return;
    }
    const raw = (nameInput.value || "").trim().slice(0, 10);
    const name = raw.length ? raw : "名無し";
    const list = leaderboards[runDifficulty] || [];
    const newEntries = list
      .concat([{ name: name, score: pendingScore, ts: Date.now() }])
      .sort(function (a, b) { return b.score - a.score; })
      .slice(0, 5);
    db.doc("scores/" + runDifficulty).set({ entries: newEntries }).catch(function () {
      /* 反映に失敗しても対戦は続けられる */
    });
    closeNameEntry();
  }

  submitNameBtn.addEventListener("click", submitName);
  skipNameBtn.addEventListener("click", closeNameEntry);
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      submitName();
    } else if (e.key === "Escape") {
      e.preventDefault();
      closeNameEntry();
    }
  });

  // ---- ゲーム状態 ----
  // "title" | "playing" | "gameover"
  let state = "title";

  let playerX = 100;
  let playerY = 0;
  let playerVY = 0;

  let tail = [];
  let tailTimer = 0;

  let obstacles = [];
  let spawnDistance = 0;

  let score = 0;
  let best = 0;
  try {
    best = parseInt(localStorage.getItem("itodoshi_best") || "0", 10) || 0;
  } catch (e) {
    best = 0;
  }

  let scrollSpeed = BASE_SCROLL_SPEED;
  let currentGap = GAP_BASE;

  let holding = false;

  function resetGame() {
    runDifficulty = selectedDifficulty;
    playerY = height / 2;
    playerVY = 0;
    tail = [];
    tailTimer = 0;
    obstacles = [];
    spawnDistance = OBSTACLE_SPACING * 0.55;
    score = 0;
    scrollSpeed = BASE_SCROLL_SPEED;
    currentGap = GAP_BASE;
    state = "playing";
  }

  function spawnObstacle() {
    const margin = 36;
    const maxTop = Math.max(margin, height - margin - currentGap);
    const gapTop = margin + Math.random() * Math.max(1, maxTop - margin);
    obstacles.push({
      x: width + OBSTACLE_WIDTH,
      gapTop: gapTop,
      gapHeight: currentGap,
      passed: false
    });
  }

  function triggerGameOver() {
    if (state !== "playing") return;
    state = "gameover";
    if (score > best) {
      best = score;
      try {
        localStorage.setItem("itodoshi_best", String(best));
      } catch (e) {
        /* no-op */
      }
    }
    if (db && score > 0) {
      const list = leaderboards[runDifficulty] || [];
      const qualifies = list.length < 5 || score > list[list.length - 1].score;
      if (qualifies) openNameEntry(score);
    }
  }

  function getDifficultyRects() {
    const btnW = Math.min(96, width * 0.27);
    const btnH = 32;
    const gap = 12;
    const totalW = btnW * 3 + gap * 2;
    const startX = width / 2 - totalW / 2;
    const y = height / 2 - 64;
    return DIFFICULTY_ORDER.map(function (key, i) {
      return { key: key, x: startX + i * (btnW + gap), y: y, w: btnW, h: btnH };
    });
  }

  function handlePressAt(x, y) {
    if (nameEntryOpen) return;
    if (state === "title") {
      const rects = getDifficultyRects();
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
          applyDifficulty(r.key);
          return;
        }
      }
      resetGame();
    } else if (state === "gameover") {
      resetGame();
    }
  }

  window.addEventListener(
    "keydown",
    function (e) {
      if (nameEntryOpen) return;
      if (e.code === "Space" || e.key === " ") {
        e.preventDefault();
        if (!holding) {
          holding = true;
          if (state === "title" || state === "gameover") resetGame();
        }
      } else if (state === "title" && (e.code === "ArrowLeft" || e.code === "ArrowRight")) {
        e.preventDefault();
        cycleDifficulty(e.code === "ArrowLeft" ? -1 : 1);
      }
    },
    { passive: false }
  );

  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.key === " ") holding = false;
  });

  canvas.addEventListener(
    "touchstart",
    function (e) {
      if (nameEntryOpen) return;
      e.preventDefault();
      if (!holding) {
        holding = true;
        const t = e.changedTouches[0];
        const rect = canvas.getBoundingClientRect();
        handlePressAt(t.clientX - rect.left, t.clientY - rect.top);
      }
    },
    { passive: false }
  );

  canvas.addEventListener(
    "touchend",
    function (e) {
      e.preventDefault();
      holding = false;
    },
    { passive: false }
  );

  canvas.addEventListener("touchcancel", function () { holding = false; }, { passive: false });

  canvas.addEventListener("mousedown", function (e) {
    if (nameEntryOpen) return;
    if (!holding) {
      holding = true;
      const rect = canvas.getBoundingClientRect();
      handlePressAt(e.clientX - rect.left, e.clientY - rect.top);
    }
  });
  window.addEventListener("mouseup", function () { holding = false; });

  window.addEventListener("resize", resize);

  // ---- 更新 ----
  function update(dt) {
    if (state !== "playing") return;

    const accel = holding ? -LIFT : GRAVITY;
    playerVY += accel * dt;
    playerVY = Math.max(-MAX_UP_SPEED, Math.min(MAX_DOWN_SPEED, playerVY));
    playerY += playerVY * dt;

    tailTimer += dt;
    if (tailTimer >= TAIL_SAMPLE_INTERVAL) {
      tailTimer = 0;
      tail.unshift(playerY);
      if (tail.length > TAIL_LENGTH) tail.pop();
    }

    scrollSpeed = Math.min(MAX_SCROLL_SPEED, BASE_SCROLL_SPEED + score * SPEED_INCREASE_PER_SCORE);
    currentGap = Math.max(GAP_MIN, GAP_BASE - score * GAP_DECREASE_PER_SCORE);

    spawnDistance += scrollSpeed * dt;
    if (spawnDistance >= OBSTACLE_SPACING) {
      spawnDistance -= OBSTACLE_SPACING;
      spawnObstacle();
    }

    for (let i = 0; i < obstacles.length; i++) obstacles[i].x -= scrollSpeed * dt;
    obstacles = obstacles.filter(function (ob) { return ob.x + OBSTACLE_WIDTH > -10; });

    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (!ob.passed && ob.x + OBSTACLE_WIDTH < playerX) {
        ob.passed = true;
        score++;
      }
      const overlapX = playerX + PLAYER_RADIUS > ob.x && playerX - PLAYER_RADIUS < ob.x + OBSTACLE_WIDTH;
      if (overlapX) {
        if (playerY - PLAYER_RADIUS < ob.gapTop || playerY + PLAYER_RADIUS > ob.gapTop + ob.gapHeight) {
          triggerGameOver();
        }
      }
    }

    if (playerY - PLAYER_RADIUS < 0 || playerY + PLAYER_RADIUS > height) {
      playerY = Math.max(PLAYER_RADIUS, Math.min(height - PLAYER_RADIUS, playerY));
      triggerGameOver();
    }
  }

  // ---- 描画 ----
  function drawBoundaries() {
    ctx.strokeStyle = COLOR_DIM;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, 1); ctx.lineTo(width, 1);
    ctx.moveTo(0, height - 1); ctx.lineTo(width, height - 1);
    ctx.stroke();
  }

  function drawObstacles() {
    ctx.fillStyle = COLOR_OBSTACLE;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      ctx.fillRect(ob.x, 0, OBSTACLE_WIDTH, ob.gapTop);
      ctx.fillRect(ob.x, ob.gapTop + ob.gapHeight, OBSTACLE_WIDTH, height - (ob.gapTop + ob.gapHeight));
    }
  }

  function drawTail() {
    if (tail.length < 2) return;
    for (let i = 0; i < tail.length - 1; i++) {
      const t = i / tail.length;
      const alpha = (1 - t) * 0.5;
      ctx.strokeStyle = "rgba(245, 245, 242, " + alpha.toFixed(3) + ")";
      ctx.lineWidth = Math.max(1, 3.5 * (1 - t));
      ctx.beginPath();
      ctx.moveTo(playerX - i * TAIL_SPACING, tail[i]);
      ctx.lineTo(playerX - (i + 1) * TAIL_SPACING, tail[i + 1]);
      ctx.stroke();
    }
  }

  function drawPlayer() {
    ctx.strokeStyle = COLOR_FG;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(playerX, playerY - PLAYER_RADIUS);
    ctx.lineTo(playerX, playerY + PLAYER_RADIUS);
    ctx.stroke();
  }

  function drawScore() {
    ctx.fillStyle = COLOR_FG;
    ctx.font = "28px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(String(score), width / 2, 22);

    ctx.fillStyle = COLOR_DIM;
    ctx.font = "12px monospace";
    ctx.textAlign = "left";
    ctx.fillText(DIFFICULTIES[runDifficulty].label, 14, 16);
  }

  function drawDifficultyButtons() {
    const rects = getDifficultyRects();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "13px monospace";
    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      const active = r.key === selectedDifficulty;
      const cx = r.x + r.w / 2;
      const cy = r.y + r.h / 2;
      if (active) {
        ctx.fillStyle = COLOR_FG;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.fillStyle = COLOR_BG;
      } else {
        ctx.strokeStyle = COLOR_DIM;
        ctx.lineWidth = 1;
        ctx.strokeRect(r.x + 0.5, r.y + 0.5, r.w - 1, r.h - 1);
        ctx.fillStyle = COLOR_DIM;
      }
      ctx.fillText(DIFFICULTIES[r.key].label, cx, cy);
    }
  }

  function drawLeaderboard() {
    if (!db) return;
    const list = leaderboards[selectedDifficulty] || [];
    const headerY = height / 2 + 6;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "11px monospace";
    ctx.fillStyle = COLOR_DIM;
    ctx.fillText("TOP5 ・ " + DIFFICULTIES[selectedDifficulty].label, width / 2, headerY);

    const blockX0 = width / 2 - 92;
    const blockX1 = width / 2 + 92;
    const rowH = 16;
    for (let i = 0; i < 5; i++) {
      const y = headerY + 18 + i * rowH;
      const entry = list[i];
      ctx.font = "12px monospace";
      ctx.textBaseline = "middle";
      ctx.fillStyle = i === 0 && entry ? COLOR_ACCENT : COLOR_DIM;
      ctx.textAlign = "left";
      const rankLabel = (i + 1) + ". " + (entry ? entry.name : "---");
      ctx.fillText(rankLabel, blockX0, y);
      ctx.textAlign = "right";
      ctx.fillText(entry ? String(entry.score) : "", blockX1, y);
    }
  }

  function drawTitle() {
    ctx.fillStyle = COLOR_FG;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = 'bold 32px "MS Gothic", monospace';
    ctx.fillText("糸 通 し", width / 2, height / 2 - 146);

    ctx.font = "13px monospace";
    ctx.fillStyle = COLOR_DIM;
    ctx.fillText("長押しで上昇 / 離すと下降", width / 2, height / 2 - 106);
    ctx.fillText("← → で難易度選択", width / 2, height / 2 - 88);

    drawDifficultyButtons();
    drawLeaderboard();

    ctx.fillStyle = COLOR_FG;
    ctx.font = "17px monospace";
    const blink = Math.floor(performance.now() / 500) % 2 === 0;
    if (blink) {
      ctx.fillText("SPACE または タップで START", width / 2, height / 2 + 118);
    }

    if (best > 0) {
      ctx.fillStyle = COLOR_DIM;
      ctx.font = "13px monospace";
      ctx.fillText("自己ベスト " + best, width / 2, height / 2 + 144);
    }
  }

  function drawGameOver() {
    ctx.fillStyle = "rgba(20, 23, 26, 0.55)";
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = COLOR_FG;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "bold 30px monospace";
    ctx.fillText("GAME OVER", width / 2, height / 2 - 50);

    ctx.font = "20px monospace";
    ctx.fillText("SCORE " + score, width / 2, height / 2 - 8);

    ctx.fillStyle = COLOR_DIM;
    ctx.font = "16px monospace";
    ctx.fillText("自己ベスト " + best, width / 2, height / 2 + 22);

    if (!nameEntryOpen) {
      ctx.fillStyle = COLOR_FG;
      ctx.font = "16px monospace";
      const blink = Math.floor(performance.now() / 500) % 2 === 0;
      if (blink) {
        ctx.fillText("SPACE または タップで RETRY", width / 2, height / 2 + 62);
      }
    }
  }

  function render() {
    ctx.fillStyle = COLOR_BG;
    ctx.fillRect(0, 0, width, height);

    if (state === "title") {
      drawBoundaries();
      drawTitle();
      return;
    }

    drawBoundaries();
    drawObstacles();
    drawTail();
    drawPlayer();
    drawScore();

    if (state === "gameover") drawGameOver();
  }

  // ---- メインループ ----
  let lastTime = null;
  function frame(ts) {
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (dt > 0.033) dt = 0.033;

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  resize();
  playerY = height / 2;
  requestAnimationFrame(frame);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {
      /* PWA登録に失敗してもゲーム自体は通常どおり遊べる */
    });
  });
}
</script>
</body>
</html>
